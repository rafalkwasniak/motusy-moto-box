; Motusy Moto Box — konfiguracja PlatformIO
;
; Trzy srodowiska:
;   sticks3  — firmware na M5StickS3 (domyslne)
;   native   — testy jednostkowe algorytmow na komputerze
;   replay   — odtwarzanie nagranego CSV przez algorytm na komputerze
;
; Algorytmy w lib/ sa czystym C++ bez zaleznosci od M5Unified, dzieki czemu
; kompiluja sie we wszystkich trzech srodowiskach. Patrz docs/architektura-techniczna.md §10.

[platformio]
name = MotusyMotoBox
default_envs = sticks3
boards_dir = boards

; ─────────────────────────────────────────────────────────────────────────────
; Firmware
; ─────────────────────────────────────────────────────────────────────────────
; Konfiguracja odwzorowuje oficjalny przepis M5Stack dla StickS3.
; NIE zmieniac wersji platformy ani memory_type bez sprawdzenia na sprzecie —
; wlasna definicja plytki na platformie 7.0.1 dawala czarny ekran i martwy port
; szeregowy (2026-08-28). Plik boards/m5stack-sticks3.json zostaje jako
; dokumentacja sprzetu, ale nie jest uzywany do budowania.
[env:sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.partitions = motobox_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

lib_deps =
    m5stack/M5Unified@^0.2.21

build_flags =
    -DESP32S3
    ; PSRAM celowo NIEUZYWANY: sluzyl tylko na 65 kB bufora ekranu, ktory miesci
    ; sie w pamieci wewnetrznej (25 z 320 kB zajete). Osiem megabajtow PSRAM
    ; pobieralo prad takze w light sleep — patrz docs §4.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    ; Rejestrator surowych danych IMU na partycji storage (~28 min @ 100 Hz).
    ; Przed jazda testowa ustawic na 1 i wgrac; zgrywanie po USB: L / D<nr> / X.
    -DMMB_RAW_LOGGER=0

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800

; ─────────────────────────────────────────────────────────────────────────────
; Testy jednostkowe algorytmow
; ─────────────────────────────────────────────────────────────────────────────
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    -std=c++17
    -Wall
    -Wextra

; ─────────────────────────────────────────────────────────────────────────────
; Narzedzie replay: CSV z prawdziwej jazdy -> ten sam algorytm co na urzadzeniu
; Uzycie: pio run -e replay && .pio/build/replay/program nagranie.csv
; ─────────────────────────────────────────────────────────────────────────────
[env:replay]
platform = native
build_src_filter = -<*> +<../tools/replay/>
build_flags =
    -std=c++17
    -Wall
    -Wextra
